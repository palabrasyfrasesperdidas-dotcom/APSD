<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teoría - Primeros Auxilios</title>
  <style>
    :root {
      --board-bg-gradient: radial-gradient(circle at 50% 20%, #263c2c 0%, #18261c 100%);
      --frame-border: #5a3c24;
      --frame-shadow: rgba(0, 0, 0, 0.55);
      --text-main: #f4f6f3;
      --text-muted: #c7d1c9;
      --card-yellow: #fff099;
      --card-text: #162019;
      --card-subtext: #2c3a30;
      --btn-bg: #3b2818;
      --btn-hover: #4e3520;
      --btn-text: #f7f4ee;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: #141715;
      background-image: radial-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 16px 16px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 16px;
    }

    .board-frame {
      width: 100%;
      max-width: 1080px;
      background: var(--board-bg-gradient);
      border: 10px solid var(--frame-border);
      border-radius: 18px;
      box-shadow: 0 22px 50px var(--frame-shadow), inset 0 0 40px rgba(0, 0, 0, 0.35);
      padding: 44px 48px 36px;
    }

    h1 {
      font-size: clamp(1.85rem, 3.6vw, 2.6rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-main);
      margin-bottom: 24px;
    }

    .divider {
      border: 0;
      border-top: 1px dashed rgba(255, 255, 255, 0.25);
      margin-bottom: 32px;
    }

    .topics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 340px));
      gap: 24px;
      margin-bottom: 36px;
    }

    .topic-card {
      background-color: var(--card-yellow);
      color: var(--card-text);
      border-radius: 10px;
      padding: 24px 24px 22px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 18px;
    }

    .topic-card h2 {
      font-size: 1.28rem;
      font-weight: 700;
      line-height: 1.28;
      margin-bottom: 10px;
      color: var(--card-text);
    }

    .topic-card p {
      font-size: 0.95rem;
      line-height: 1.48;
      color: var(--card-subtext);
    }

    .download-btn {
      align-self: flex-start;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      background-color: var(--btn-bg);
      color: var(--btn-text);
      text-decoration: none;
      font-size: 0.92rem;
      font-weight: 600;
      padding: 10px 16px;
      border-radius: 7px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.22);
      transition: background-color 0.16s ease, transform 0.16s ease;
    }

    .download-btn:hover {
      background-color: var(--btn-hover);
      transform: translateY(-1px);
    }

    .footer-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 0.94rem;
    }

    .back-link {
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.15s ease;
    }

    .back-link:hover {
      color: var(--text-main);
      text-decoration: underline;
    }

    @media (max-width: 720px) {
      .board-frame {
        padding: 32px 24px 28px;
      }

      .topics-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="board-frame">
    <h1>Teoría - Documentos y Temas Disponibles</h1>

    <hr class="divider" />

    <section class="topics-grid" aria-label="Temas disponibles de Primeros Auxilios">
      <article class="topic-card">
        <div>
          <h2>Primeros Auxilios: UD 1, 2 y 3.1</h2>
          <p>Documento teórico de apuntes y contenidos fundamentales de las unidades disponibles.</p>
        </div>
        <a class="download-btn" href="primeros-auxilios-ud-1-2-y-3-1.pdf" download>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 3V15M12 15L7 10M12 15L17 10" stroke="#7cc4fa" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M4 17V19C4 20.1046 4.89543 21 6 21H18C19.1046 21 20 20.1046 20 19V17" stroke="#f7f4ee" stroke-width="2.2" stroke-linecap="round"/>
          </svg>
          <span>Descargar PDF</span>
        </a>
      </article>
    </section>

    <footer class="footer-nav">
      <a class="back-link" href="primeros-auxilios.html">← Volver a la asignatura</a>
    </footer>
  </main>
</body>
</html>
