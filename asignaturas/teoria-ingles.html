<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teoría - Inglés</title>
    <style>
        :root {
            --bg-board: #2b3a32;
            --board-frame: #4a3525;
            --text-chalk: #f4f4f0;
            --postit-yellow: #fff3a8;
            --postit-blue: #a0c4ff;
            --text-dark: #2b2b2b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #1a2420;
            background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 0);
            background-size: 24px 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .board-container {
            width: 100%;
            max-width: 1100px;
            background-color: var(--bg-board);
            border: 14px solid var(--board-frame);
            border-radius: 18px;
            padding: 35px 30px;
            box-shadow: inset 0 0 60px rgba(0,0,0,0.6), 0 15px 35px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        header h1 {
            color: var(--text-chalk);
            font-size: 2.1em;
            border-bottom: 2px dashed rgba(255,255,255,0.25);
            padding-bottom: 15px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .sections-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            padding: 5px 0;
        }

        .section-card {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 22px;
            min-height: 175px;
            text-decoration: none;
            color: var(--text-dark);
            border-radius: 6px 6px 6px 16px;
            box-shadow: 4px 6px 15px rgba(0,0,0,0.35);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            gap: 16px;
        }

        .section-card:hover {
            transform: translateY(-3px);
            box-shadow: 6px 9px 20px rgba(0,0,0,0.45);
        }

        .section-card h3 {
            font-size: 1.25em;
            font-weight: 700;
            color: #222;
            line-height: 1.3;
        }

        .section-card p {
            font-size: 0.9em;
            opacity: 0.88;
            margin-top: 8px;
            line-height: 1.4;
        }

        .c-yellow { background-color: var(--postit-yellow); }
        .c-blue   { background-color: var(--postit-blue); }

        .back-nav {
            margin-top: 5px;
        }

        .back-btn {
            color: var(--text-chalk);
            text-decoration: none;
            font-size: 0.95em;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            opacity: 0.85;
            transition: opacity 0.2s;
        }

        .back-btn:hover {
            opacity: 1;
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .board-container {
                border-width: 8px;
                padding: 20px 15px;
            }
            header h1 {
                font-size: 1.6em;
            }
        }
    </style>
</head>
<body>

    <main class="board-container">
        <header>
            <h1>Teoría - Inglés</h1>
        </header>

        <div class="sections-grid">
            <a href="gramatica-ingles.html" class="section-card c-yellow">
                <div>
                    <h3>Gramática</h3>
                    <p>Estructuras verbales, demostrativos, cuantificadores, presente simple/continuo y comparativos/superlativos.</p>
                </div>
                <span style="font-size: 0.85em; font-weight: bold;">Ver gramática &rarr;</span>
            </a>

            <a href="vocabulario-ingles.html" class="section-card c-blue">
                <div>
                    <h3>Vocabulario</h3>
                    <p>Términos clave, expresiones habituales y léxico aplicado al ámbito profesional.</p>
                </div>
                <span style="font-size: 0.85em; font-weight: bold;">Ver vocabulario &rarr;</span>
            </a>
        </div>

        <div class="back-nav">
            <a href="ingles.html" class="back-btn">&larr; Volver a la asignatura</a>
        </div>
    </main>

</body>
</html>
