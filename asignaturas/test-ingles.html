<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test - Inglés (APSD)</title>
    <style>
        :root {
            --bg-board: #2b3a32;
            --board-frame: #4a3525;
            --text-chalk: #f4f4f0;
            --postit-yellow: #fff3a8;
            --postit-blue: #a0c4ff;
            --postit-peach: #ffd6a5;
            --postit-mint: #b9fbc0;
            --postit-lavender: #d8c7ff;
            --postit-pink: #ffc6ff;
            --text-dark: #2b2b2b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #1a2420;
            background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 0);
            background-size: 24px 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .board-container {
            width: 100%;
            max-width: 1100px;
            background-color: var(--bg-board);
            border: 14px solid var(--board-frame);
            border-radius: 18px;
            padding: 32px 26px;
            box-shadow: inset 0 0 60px rgba(0,0,0,0.6), 0 15px 35px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        header h1 {
            color: var(--text-chalk);
            font-size: 2.1em;
            font-weight: 700;
            line-height: 1.2;
        }

        .subtitle {
            color: rgba(244, 244, 240, 0.85);
            font-size: 0.98em;
            margin-top: 8px;
            padding-bottom: 16px;
            border-bottom: 2px dashed rgba(255,255,255,0.25);
        }

        /* CUADRÍCULA DE 6 MODELOS */
        .models-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
            gap: 16px;
            padding: 6px 0;
        }

        .model-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 22px 14px;
            min-height: 115px;
            border: none;
            border-radius: 6px 6px 6px 14px;
            color: var(--text-dark);
            cursor: pointer;
            touch-action: manipulation;
            box-shadow: 3px 5px 12px rgba(0, 0, 0, 0.35);
            transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
        }

        .model-card:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 5px 8px 18px rgba(0, 0, 0, 0.45);
        }

        .model-card:active {
            transform: scale(0.98);
        }

        .model-card.active-model {
            outline: 3px solid #ffffff;
            filter: brightness(1.04);
        }

        .model-card strong {
            font-size: 1.15em;
            display: block;
            margin-bottom: 4px;
        }

        .model-card span {
            font-size: 0.86em;
            opacity: 0.88;
        }

        .m-yellow   { background-color: var(--postit-yellow); }
        .m-blue     { background-color: var(--postit-blue); }
        .m-peach    { background-color: var(--postit-peach); }
        .m-mint     { background-color: var(--postit-mint); }
        .m-lavender { background-color: var(--postit-lavender); }
        .m-pink     { background-color: var(--postit-pink); }

        /* ZONA DE EXAMEN ACTIVO */
        .exam-panel {
            display: none;
            flex-direction: column;
            gap: 18px;
            background: rgba(0, 0, 0, 0.22);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 12px;
            padding: 22px 18px;
        }

        .exam-panel.visible {
            display: flex;
        }

        .exam-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding-bottom: 12px;
        }

        .exam-top-bar h2 {
            color: var(--postit-yellow);
            font-size: 1.35em;
        }

        .progress-pill {
            background: rgba(255, 255, 255, 0.12);
            color: var(--text-chalk);
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 0.9em;
            font-weight: 600;
        }

        .question-box {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            padding: 18px 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .question-prompt {
            color: var(--text-chalk);
            font-size: 1.08em;
            line-height: 1.5;
            font-weight: 500;
        }

        .blank-slot {
            display: inline-block;
            min-width: 96px;
            padding: 2px 10px;
            margin: 0 3px;
            border-bottom: 2px solid var(--postit-yellow);
            color: var(--postit-yellow);
            font-weight: 700;
            text-align: center;
        }

        /* RECUADROS TÁCTILES DE 4 OPCIONES */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .option-btn {
            min-height: 50px;
            padding: 12px 14px;
            background-color: var(--postit-yellow);
            color: var(--text-dark);
            border: 2px solid transparent;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            touch-action: manipulation;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.28);
            transition: transform 0.12s ease, background-color 0.15s ease, border-color 0.15s ease;
        }

        .option-btn:hover {
            background-color: #ffe96b;
            transform: translateY(-1px);
        }

        .option-btn:active {
            transform: scale(0.98);
        }

        .option-btn.selected {
            background-color: var(--postit-blue);
            border-color: #ffffff;
            color: #151a17;
        }

        .actions-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 4px;
        }

        .btn-primary, .btn-secondary {
            min-height: 46px;
            padding: 11px 20px;
            border-radius: 8px;
            font-size: 0.98em;
            font-weight: 700;
            cursor: pointer;
            touch-action: manipulation;
            border: none;
            transition: opacity 0.15s ease, transform 0.12s ease;
        }

        .btn-primary {
            background-color: var(--postit-mint);
            color: var(--text-dark);
        }

        .btn-primary:hover {
            opacity: 0.92;
        }

        .btn-secondary {
            background-color: rgba(255, 255, 255, 0.16);
            color: var(--text-chalk);
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.24);
        }

        .validation-msg {
            color: var(--postit-peach);
            font-size: 0.95em;
            font-weight: 600;
            min-height: 22px;
        }

        /* RESULTADOS Y ERRORES */
        .results-box {
            display: none;
            flex-direction: column;
            gap: 16px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 20px 18px;
            border-left: 5px solid var(--postit-mint);
        }

        .results-box.visible {
            display: flex;
        }

        .score-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .score-badge {
            font-size: 1.55em;
            font-weight: 800;
            color: var(--postit-mint);
        }

        .score-detail {
            color: var(--text-chalk);
            font-size: 1em;
        }

        .perfect-msg {
            background-color: var(--postit-mint);
            color: var(--text-dark);
            padding: 14px 16px;
            border-radius: 8px;
            font-weight: 700;
        }

        .errors-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .error-card {
            background-color: #fff8dc;
            color: var(--text-dark);
            border-left: 5px solid #c92a2a;
            border-radius: 6px;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
        }

        .error-card .err-q {
            font-weight: 700;
            font-size: 1.02em;
        }

        .error-card .err-wrong {
            color: #b02a2a;
            font-weight: 600;
        }

        .error-card .err-right {
            color: #1b5e20;
            font-weight: 700;
        }

        .error-card .err-note {
            font-size: 0.92em;
            opacity: 0.9;
        }

        /* NAVEGACIÓN INFERIOR */
        .back-nav {
            margin-top: 4px;
        }

        .back-btn {
            color: var(--text-chalk);
            text-decoration: none;
            font-size: 0.95em;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            opacity: 0.85;
            transition: opacity 0.2s;
        }

        .back-btn:hover {
            opacity: 1;
            text-decoration: underline;
        }

        @media (max-width: 640px) {
            .board-container {
                border-width: 8px;
                padding: 20px 14px;
            }
            header h1 {
                font-size: 1.65em;
            }
            .options-grid {
                grid-template-columns: 1fr;
            }
            .option-btn {
                min-height: 54px;
                font-size: 1.04em;
            }
        }
    </style>
</head>
<body>

    <main class="board-container">
        <header>
            <h1>Pon a prueba tus conocimientos</h1>
            <p class="subtitle">Selecciona un modelo de examen de inglés (4 frases para completar con 4 opciones cada uno). Al terminar verás tu nota y los errores cometidos.</p>
        </header>

        <!-- 6 MODELOS -->
        <section class="models-grid" aria-label="Modelos de examen">
            <button type="button" class="model-card m-yellow" data-model="A" onclick="selectModel('A')">
                <strong>📝 Modelo A</strong>
                <span>Simulacro 1 · 4 preguntas</span>
            </button>
            <button type="button" class="model-card m-blue" data-model="B" onclick="selectModel('B')">
                <strong>📝 Modelo B</strong>
                <span>Simulacro 2 · 4 preguntas</span>
            </button>
            <button type="button" class="model-card m-peach" data-model="C" onclick="selectModel('C')">
                <strong>📝 Modelo C</strong>
                <span>Simulacro 3 · 4 preguntas</span>
            </button>
            <button type="button" class="model-card m-mint" data-model="D" onclick="selectModel('D')">
                <strong>📝 Modelo D</strong>
                <span>Simulacro 4 · 4 preguntas</span>
            </button>
            <button type="button" class="model-card m-lavender" data-model="E" onclick="selectModel('E')">
                <strong>📝 Modelo E</strong>
                <span>Simulacro 5 · 4 preguntas</span>
            </button>
            <button type="button" class="model-card m-pink" data-model="F" onclick="selectModel('F')">
                <strong>📝 Modelo F</strong>
                <span>Simulacro 6 · 4 preguntas</span>
            </button>
        </section>

        <!-- EXAMEN SELECCIONADO -->
        <section id="exam-panel" class="exam-panel" aria-live="polite">
            <div class="exam-top-bar">
                <h2 id="exam-title">Modelo A</h2>
                <span id="answered-counter" class="progress-pill">Respondidas: 0 / 4</span>
            </div>

            <div id="questions-container"></div>

            <div id="validation-msg" class="validation-msg"></div>

            <div class="actions-row">
                <button type="button" class="btn-secondary" onclick="resetCurrentModel()">Limpiar respuestas</button>
                <button type="button" class="btn-primary" onclick="gradeExam()">Corregir examen</button>
            </div>

            <!-- RESULTADOS -->
            <div id="results-box" class="results-box">
                <div class="score-header">
                    <span id="score-badge" class="score-badge">Nota: 0 / 10</span>
                    <span id="score-detail" class="score-detail"></span>
                </div>
                <div id="errors-container" class="errors-list"></div>
            </div>
        </section>

        <div class="back-nav">
            <a href="ingles.html" class="back-btn">&larr; Volver a Inglés</a>
        </div>
    </main>

    <script>
        // 6 modelos x 4 preguntas = 24 frases.
        // La posición de la respuesta correcta varía en cada pregunta.
        const EXAM_MODELS = {
            A: {
                label: "Modelo A — Simulacro 1",
                questions: [
                    {
                        before: "What ",
                        after: " you do every morning before starting your shift?",
                        options: ["are", "do", "does", "have"],
                        answer: "do",
                        tip: "En preguntas con verbo de acción en presente simple y sujeto 'you', usamos el auxiliar 'do' ('What do you do...?')."
                    },
                    {
                        before: "Look at the resident in the garden: what ",
                        after: " you doing right now?",
                        options: ["do", "have", "are", "is"],
                        answer: "are",
                        tip: "El presente continuo con 'you' y 'doing' para una acción en progreso se forma con 'are' ('What are you doing...?')."
                    },
                    {
                        before: "She ",
                        after: " got a very clear and calm voice.",
                        options: ["is", "has", "does", "have"],
                        answer: "has",
                        tip: "Con 'have got' en 3.ª persona del singular ('she') usamos 'has got'."
                    },
                    {
                        before: "There aren't ",
                        after: " extra chairs in the activity room.",
                        options: ["some", "a", "any", "the"],
                        answer: "any",
                        tip: "En frases negativas con plural contable usamos 'any' ('aren't any')."
                    }
                ]
            },
            B: {
                label: "Modelo B — Simulacro 2",
                questions: [
                    {
                        before: "How ",
                        after: " you usually calm a nervous family member?",
                        options: ["is", "have", "do", "are"],
                        answer: "do",
                        tip: "Para preguntar por un hábito o procedimiento en presente simple con 'you', usamos 'How do you...?'"
                    },
                    {
                        before: "Please pass me ",
                        after: " water; the room is very warm.",
                        options: ["any", "some", "these", "those"],
                        answer: "some",
                        tip: "En peticiones o frases afirmativas con sustantivos incontables ('water') usamos 'some'."
                    },
                    {
                        before: "Active listening is ",
                        after: " than just hearing words.",
                        options: ["most important", "more important", "the most important", "importanter"],
                        answer: "more important",
                        tip: "El comparativo de un adjetivo largo ('important') se forma con 'more + adjetivo + than'."
                    },
                    {
                        before: "Right now, the caregiver ",
                        after: " explaining the steps slowly.",
                        options: ["is", "has", "does", "do"],
                        answer: "is",
                        tip: "En presente continuo con 'the caregiver' (3.ª persona singular) se usa 'is + verbo-ing'."
                    }
                ]
            },
            C: {
                label: "Modelo C — Simulacro 3",
                questions: [
                    {
                        before: "Are there ",
                        after: " new care plans on the desk today?",
                        options: ["some", "any", "this", "that"],
                        answer: "any",
                        tip: "En preguntas generales con plural contable ('new care plans') empleamos 'any'."
                    },
                    {
                        before: "What ",
                        after: " you doing at the moment? The bell is ringing.",
                        options: ["does", "do", "are", "has"],
                        answer: "are",
                        tip: "'What are you doing at the moment?' pregunta por una acción que ocurre en este instante (presente continuo)."
                    },
                    {
                        before: "My colleague ",
                        after: " not rush when helping elderly residents.",
                        options: ["isn't", "doesn't", "haven't", "aren't"],
                        answer: "doesn't",
                        tip: "La negativa en presente simple con verbo de acción ('rush') y sujeto singular ('my colleague') usa 'doesn't'."
                    },
                    {
                        before: "Come closer and look at ",
                        after: " notes right here in my hand.",
                        options: ["that", "those", "these", "there"],
                        answer: "these",
                        tip: "'These' es el plural de cercanía ('estos/estas') para objetos que tienes cerca."
                    }
                ]
            },
            D: {
                label: "Modelo D — Simulacro 4",
                questions: [
                    {
                        before: "How ",
                        after: " you feel when a shift starts with high tension?",
                        options: ["are", "do", "has", "is"],
                        answer: "do",
                        tip: "Con el verbo 'feel' en presente simple para 'you', la pregunta habitual es 'How do you feel...?'"
                    },
                    {
                        before: "Empathy is one of ",
                        after: " values in person-centred care.",
                        options: ["the most important", "more important", "most important", "importantest"],
                        answer: "the most important",
                        tip: "El superlativo de un adjetivo largo en un grupo se forma con 'the most + adjetivo'."
                    },
                    {
                        before: "We ",
                        after: " got enough time to do this transfer calmly.",
                        options: ["hasn't", "haven't", "isn't", "doesn't"],
                        answer: "haven't",
                        tip: "Con 'we' y 'got', la forma negativa es 'haven't got'."
                    },
                    {
                        before: "There ",
                        after: " two armchairs near the window.",
                        options: ["is", "was", "are", "be"],
                        answer: "are",
                        tip: "Con plural ('two armchairs') en presente usamos 'there are'."
                    }
                ]
            },
            E: {
                label: "Modelo E — Simulacro 5",
                questions: [
                    {
                        before: "What ",
                        after: " you doing with that wheelchair over there?",
                        options: ["do", "are", "have", "does"],
                        answer: "are",
                        tip: "'What are you doing...?' se usa para preguntar qué acción está realizando alguien en ese momento."
                    },
                    {
                        before: "Can you point to ",
                        after: " door at the end of the corridor?",
                        options: ["this", "these", "that", "those"],
                        answer: "that",
                        tip: "'That' indica un elemento singular ('door') que está lejos del hablante."
                    },
                    {
                        before: "She ",
                        after: " a care assistant; she is the social worker.",
                        options: ["aren't", "isn't", "doesn't", "don't"],
                        answer: "isn't",
                        tip: "Con el verbo 'to be' en presente simple para 'she', negamos con 'isn't'."
                    },
                    {
                        before: "What ",
                        after: " you usually write in the daily report?",
                        options: ["are", "is", "do", "have"],
                        answer: "do",
                        tip: "Para rutinas en presente simple con 'you' ('What do you usually write...?') usamos 'do'."
                    }
                ]
            },
            F: {
                label: "Modelo F — Simulacro 6",
                questions: [
                    {
                        before: "Today's session is ",
                        after: " than yesterday's workshop.",
                        options: ["gooder", "best", "better", "more good"],
                        answer: "better",
                        tip: "'Good' es irregular: su forma comparativa es 'better' ('better than')."
                    },
                    {
                        before: "Are you ",
                        after: " attention to the family's request right now?",
                        options: ["pay", "pays", "paying", "paid"],
                        answer: "paying",
                        tip: "Tras 'Are you...' en presente continuo ('right now'), el verbo principal lleva '-ing' ('paying')."
                    },
                    {
                        before: "How ",
                        after: " you adapt your language for a person with hearing loss?",
                        options: ["is", "does", "do", "are"],
                        answer: "do",
                        tip: "La estructura de pregunta en presente simple con sujeto 'you' es 'How do you + verbo base...?'"
                    },
                    {
                        before: "Respect is ",
                        after: " quality a caregiver can show.",
                        options: ["the best", "better", "best", "good"],
                        answer: "the best",
                        tip: "'The best' es el superlativo irregular de 'good' para destacar la cualidad máxima."
                    }
                ]
            }
        };

        let currentModelKey = null;
        let userAnswers = {};

        function selectModel(modelKey) {
            currentModelKey = modelKey;
            userAnswers = {};

            document.querySelectorAll('.model-card').forEach(card => {
                card.classList.toggle('active-model', card.dataset.model === modelKey);
            });

            const modelData = EXAM_MODELS[modelKey];
            document.getElementById('exam-title').textContent = modelData.label;
            document.getElementById('validation-msg').textContent = "";
            document.getElementById('results-box').classList.remove('visible');
            document.getElementById('errors-container').innerHTML = "";

            renderQuestions(modelData.questions);
            updateProgress();

            const panel = document.getElementById('exam-panel');
            panel.classList.add('visible');
            panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function renderQuestions(questions) {
            const container = document.getElementById('questions-container');
            container.innerHTML = "";

            questions.forEach((q, qIdx) => {
                const qBox = document.createElement('div');
                qBox.className = "question-box";

                const prompt = document.createElement('p');
                prompt.className = "question-prompt";
                prompt.innerHTML = `<strong>${qIdx + 1}.</strong> ${q.before}<span id="blank-${qIdx}" class="blank-slot">_______</span>${q.after}`;
                qBox.appendChild(prompt);

                const optsGrid = document.createElement('div');
                optsGrid.className = "options-grid";

                q.options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.type = "button";
                    btn.className = "option-btn";
                    btn.textContent = opt;
                    btn.onclick = () => chooseOption(qIdx, opt, btn, optsGrid);
                    optsGrid.appendChild(btn);
                });

                qBox.appendChild(optsGrid);
                container.appendChild(qBox);
            });
        }

        function chooseOption(qIdx, chosenValue, clickedBtn, optsGrid) {
            userAnswers[qIdx] = chosenValue;
            document.getElementById('validation-msg').textContent = "";

            optsGrid.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
            clickedBtn.classList.add('selected');

            const blankEl = document.getElementById(`blank-${qIdx}`);
            if (blankEl) {
                blankEl.textContent = chosenValue;
            }

            updateProgress();
        }

        function updateProgress() {
            if (!currentModelKey) return;
            const total = EXAM_MODELS[currentModelKey].questions.length;
            const answered = Object.keys(userAnswers).length;
            document.getElementById('answered-counter').textContent = `Respondidas: ${answered} / ${total}`;
        }

        function resetCurrentModel() {
            if (!currentModelKey) return;
            selectModel(currentModelKey);
        }

        function gradeExam() {
            if (!currentModelKey) return;
            const questions = EXAM_MODELS[currentModelKey].questions;

            if (Object.keys(userAnswers).length < questions.length) {
                document.getElementById('validation-msg').textContent = "Completa las 4 frases antes de corregir el examen.";
                return;
            }

            document.getElementById('validation-msg').textContent = "";

            let correctCount = 0;
            const errors = [];

            questions.forEach((q, idx) => {
                const given = userAnswers[idx];
                if (given === q.answer) {
                    correctCount++;
                } else {
                    errors.push({
                        number: idx + 1,
                        fullSentence: `${q.before}[${q.answer}]${q.after}`,
                        given,
                        answer: q.answer,
                        tip: q.tip
                    });
                }
            });

            const score = ((correctCount / questions.length) * 10).toFixed(2).replace(/\.00$/, '');
            const resultsBox = document.getElementById('results-box');
            const scoreBadge = document.getElementById('score-badge');
            const scoreDetail = document.getElementById('score-detail');
            const errorsContainer = document.getElementById('errors-container');

            scoreBadge.textContent = `Nota: ${score} / 10`;
            scoreDetail.textContent = `Aciertos: ${correctCount} de ${questions.length} · Fallos: ${errors.length}`;
            errorsContainer.innerHTML = "";

            if (errors.length === 0) {
                const perfect = document.createElement('div');
                perfect.className = "perfect-msg";
                perfect.textContent = "¡Excelente! No has cometido ningún error en este modelo.";
                errorsContainer.appendChild(perfect);
            } else {
                errors.forEach(err => {
                    const card = document.createElement('div');
                    card.className = "error-card";
                    card.innerHTML = `
                        <div class="err-q">Pregunta ${err.number}: ${err.fullSentence}</div>
                        <div class="err-wrong">Tu respuesta: ${err.given}</div>
                        <div class="err-right">Respuesta correcta: ${err.answer}</div>
                        <div class="err-note">${err.tip}</div>
                    `;
                    errorsContainer.appendChild(card);
                });
            }

            resultsBox.classList.add('visible');
            resultsBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
    </script>

</body>
</html>
