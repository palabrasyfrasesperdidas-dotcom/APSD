<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test - Inglés (APSD)</title>
    <style>
        :root {
            --bg-board: #2b3a32;
            --board-frame: #4a3525;
            --text-chalk: #f4f4f0;
            --postit-yellow: #fff3a8;
            --postit-blue: #a0c4ff;
            --postit-peach: #ffd6a5;
            --postit-mint: #b9fbc0;
            --postit-lavender: #d8c7ff;
            --postit-pink: #ffc6ff;
            --text-dark: #2b2b2b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #1a2420;
            background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 0);
            background-size: 24px 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .board-container {
            width: 100%;
            max-width: 1100px;
            background-color: var(--bg-board);
            border: 14px solid var(--board-frame);
            border-radius: 18px;
            padding: 32px 26px;
            box-shadow: inset 0 0 60px rgba(0,0,0,0.6), 0 15px 35px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        header h1 {
            color: var(--text-chalk);
            font-size: 2.1em;
            font-weight: 700;
            line-height: 1.2;
        }

        .subtitle {
            color: rgba(244, 244, 240, 0.85);
            font-size: 0.98em;
            margin-top: 8px;
            padding-bottom: 16px;
            border-bottom: 2px dashed rgba(255,255,255,0.25);
        }

        /* CUADRÍCULA DE 6 MODELOS */
        .models-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
            gap: 16px;
            padding: 6px 0;
        }

        .model-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 22px 14px;
            min-height: 115px;
            border: none;
            border-radius: 6px 6px 6px 14px;
            color: var(--text-dark);
            cursor: pointer;
            touch-action: manipulation;
            box-shadow: 3px 5px 12px rgba(0, 0, 0, 0.35);
            transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
        }

        .model-card:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 5px 8px 18px rgba(0, 0, 0, 0.45);
        }

        .model-card:active {
            transform: scale(0.98);
        }

        .model-card.active-model {
            outline: 3px solid #ffffff;
            filter: brightness(1.04);
        }

        .model-card strong {
            font-size: 1.15em;
            display: block;
            margin-bottom: 4px;
        }

        .model-card span {
            font-size: 0.86em;
            opacity: 0.88;
        }

        .m-yellow   { background-color: var(--postit-yellow); }
        .m-blue     { background-color: var(--postit-blue); }
        .m-peach    { background-color: var(--postit-peach); }
        .m-mint     { background-color: var(--postit-mint); }
        .m-lavender { background-color: var(--postit-lavender); }
        .m-pink     { background-color: var(--postit-pink); }

        /* ZONA DE EXAMEN ACTIVO */
        .exam-panel {
            display: none;
            flex-direction: column;
            gap: 18px;
            background: rgba(0, 0, 0, 0.22);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 12px;
            padding: 22px 18px;
        }

        .exam-panel.visible {
            display: flex;
        }

        .exam-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding-bottom: 12px;
        }

        .exam-top-bar h2 {
            color: var(--postit-yellow);
            font-size: 1.35em;
        }

        .progress-pill {
            background: rgba(255, 255, 255, 0.12);
            color: var(--text-chalk);
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 0.9em;
            font-weight: 600;
        }

        #questions-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .question-box {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            padding: 18px 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .question-prompt {
            color: var(--text-chalk);
            font-size: 1.08em;
            line-height: 1.5;
            font-weight: 500;
        }

        .blank-slot {
            display: inline-block;
            min-width: 96px;
            padding: 2px 10px;
            margin: 0 3px;
            border-bottom: 2px solid var(--postit-yellow);
            color: var(--postit-yellow);
            font-weight: 700;
            text-align: center;
        }

        /* RECUADROS TÁCTILES DE 4 OPCIONES */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .option-btn {
            min-height: 50px;
            padding: 12px 14px;
            background-color: var(--postit-yellow);
            color: var(--text-dark);
            border: 2px solid transparent;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            touch-action: manipulation;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.28);
            transition: transform 0.12s ease, background-color 0.15s ease, border-color 0.15s ease;
        }

        .option-btn:hover {
            background-color: #ffe96b;
            transform: translateY(-1px);
        }

        .option-btn:active {
            transform: scale(0.98);
        }

        .option-btn.selected {
            background-color: var(--postit-blue);
            border-color: #ffffff;
            color: #151a17;
        }

        .actions-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 4px;
        }

        .btn-primary, .btn-secondary {
            min-height: 46px;
            padding: 11px 20px;
            border-radius: 8px;
            font-size: 0.98em;
            font-weight: 700;
            cursor: pointer;
            touch-action: manipulation;
            border: none;
            transition: opacity 0.15s ease, transform 0.12s ease;
        }

        .btn-primary {
            background-color: var(--postit-mint);
            color: var(--text-dark);
        }

        .btn-primary:hover {
            opacity: 0.92;
        }

        .btn-secondary {
            background-color: rgba(255, 255, 255, 0.16);
            color: var(--text-chalk);
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.24);
        }

        .validation-msg {
            color: var(--postit-peach);
            font-size: 0.95em;
            font-weight: 600;
            min-height: 22px;
        }

        /* RESULTADOS Y ERRORES */
        .results-box {
            display: none;
            flex-direction: column;
            gap: 16px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 20px 18px;
            border-left: 5px solid var(--postit-mint);
        }

        .results-box.visible {
            display: flex;
        }

        .score-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .score-badge {
            font-size: 1.55em;
            font-weight: 800;
            color: var(--postit-mint);
        }

        .score-detail {
            color: var(--text-chalk);
            font-size: 1em;
        }

        .perfect-msg {
            background-color: var(--postit-mint);
            color: var(--text-dark);
            padding: 14px 16px;
            border-radius: 8px;
            font-weight: 700;
        }

        .errors-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .error-card {
            background-color: #fff8dc;
            color: var(--text-dark);
            border-left: 5px solid #c92a2a;
            border-radius: 6px;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
        }

        .error-card .err-q {
            font-weight: 700;
            font-size: 1.02em;
        }

        .error-card .err-wrong {
            color: #b02a2a;
            font-weight: 600;
        }

        .error-card .err-right {
            color: #1b5e20;
            font-weight: 700;
        }

        .error-card .err-note {
            font-size: 0.92em;
            opacity: 0.9;
        }

        /* NAVEGACIÓN INFERIOR */
        .back-nav {
            margin-top: 4px;
        }

        .back-btn {
            color: var(--text-chalk);
            text-decoration: none;
            font-size: 0.95em;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            opacity: 0.85;
            transition: opacity 0.2s;
        }

        .back-btn:hover {
            opacity: 1;
            text-decoration: underline;
        }

        @media (max-width: 640px) {
            .board-container {
                border-width: 8px;
                padding: 20px 14px;
            }
            header h1 {
                font-size: 1.65em;
            }
            .options-grid {
                grid-template-columns: 1fr;
            }
            .option-btn {
                min-height: 54px;
                font-size: 1.04em;
            }
        }
    </style>
</head>
<body>

    <main class="board-container">
        <header>
            <h1>Pon a prueba tus conocimientos</h1>
            <p class="subtitle">Selecciona un modelo de examen de inglés (20 frases para completar con 4 opciones cada uno, alternando todos los temas de gramática). Al terminar verás tu nota y los errores cometidos.</p>
        </header>

        <!-- 6 MODELOS -->
        <section class="models-grid" aria-label="Modelos de examen">
            <button type="button" class="model-card m-yellow" data-model="A" onclick="selectModel('A')">
                <strong>📝 Modelo A</strong>
                <span>Simulacro 1 · 20 preguntas</span>
            </button>
            <button type="button" class="model-card m-blue" data-model="B" onclick="selectModel('B')">
                <strong>📝 Modelo B</strong>
                <span>Simulacro 2 · 20 preguntas</span>
            </button>
            <button type="button" class="model-card m-peach" data-model="C" onclick="selectModel('C')">
                <strong>📝 Modelo C</strong>
                <span>Simulacro 3 · 20 preguntas</span>
            </button>
            <button type="button" class="model-card m-mint" data-model="D" onclick="selectModel('D')">
                <strong>📝 Modelo D</strong>
                <span>Simulacro 4 · 20 preguntas</span>
            </button>
            <button type="button" class="model-card m-lavender" data-model="E" onclick="selectModel('E')">
                <strong>📝 Modelo E</strong>
                <span>Simulacro 5 · 20 preguntas</span>
            </button>
            <button type="button" class="model-card m-pink" data-model="F" onclick="selectModel('F')">
                <strong>📝 Modelo F</strong>
                <span>Simulacro 6 · 20 preguntas</span>
            </button>
        </section>

        <!-- EXAMEN SELECCIONADO -->
        <section id="exam-panel" class="exam-panel" aria-live="polite">
            <div class="exam-top-bar">
                <h2 id="exam-title">Modelo A</h2>
                <span id="answered-counter" class="progress-pill">Respondidas: 0 / 20</span>
            </div>

            <div id="questions-container"></div>

            <div id="validation-msg" class="validation-msg"></div>

            <div class="actions-row">
                <button type="button" class="btn-secondary" onclick="resetCurrentModel()">Limpiar respuestas</button>
                <button type="button" class="btn-primary" onclick="gradeExam()">Corregir examen</button>
            </div>

            <!-- RESULTADOS -->
            <div id="results-box" class="results-box">
                <div class="score-header">
                    <span id="score-badge" class="score-badge">Nota: 0 / 10</span>
                    <span id="score-detail" class="score-detail"></span>
                </div>
                <div id="errors-container" class="errors-list"></div>
            </div>
        </section>

        <div class="back-nav">
            <a href="ingles.html" class="back-btn">&larr; Volver a Inglés</a>
        </div>
    </main>

    <script>
        const EXAM_MODELS = {
            A: {
                label: "Modelo A — Simulacro 1",
                questions: [
                    { before: "I ", after: " a care assistant in a day centre.", options: ["am", "is", "are", "have"], answer: "am", tip: "Con 'I' en presente simple del verbo 'to be' usamos 'am'." },
                    { before: "I ", after: " got a new schedule for this month.", options: ["has", "have", "am", "are"], answer: "have", tip: "Con 'I' y 'got' usamos 'have got'." },
                    { before: "", after: " chair right next to me is very comfortable.", options: ["These", "Those", "This", "That"], answer: "This", tip: "'This' se usa para un objeto singular ('chair') que está cerca." },
                    { before: "There ", after: " a glass of water on the table.", options: ["are", "is", "some", "any"], answer: "is", tip: "Con un sustantivo singular ('a glass of water') usamos 'There is'." },
                    { before: "What ", after: " you do every morning before starting your shift?", options: ["are", "do", "does", "have"], answer: "do", tip: "En preguntas en presente simple con verbo de acción y 'you', usamos 'What do you...?'." },
                    { before: "What ", after: " you doing right now in the activity room?", options: ["do", "have", "are", "is"], answer: "are", tip: "En presente continuo ('right now') con 'you', preguntamos 'What are you doing...?'." },
                    { before: "Active listening is ", after: " than just hearing words.", options: ["most important", "more important", "the most important", "importanter"], answer: "more important", tip: "Comparativo de un adjetivo largo ('important'): 'more + adjetivo + than'." },
                    { before: "She ", after: " in the garden with the residents.", options: ["are", "is", "am", "do"], answer: "is", tip: "Con tercera persona singular ('she') en presente de 'to be' se usa 'is'." },
                    { before: "She ", after: " got a very clear and calm voice.", options: ["have", "are", "has", "is"], answer: "has", tip: "Con 'she' y 'got' usamos 'has got'." },
                    { before: "Can you see ", after: " door at the end of the corridor?", options: ["this", "these", "that", "those"], answer: "that", tip: "'That' indica un elemento singular ('door') que está lejos." },
                    { before: "There ", after: " three residents sitting in the courtyard.", options: ["is", "was", "are", "has"], answer: "are", tip: "Con un sustantivo plural ('three residents') usamos 'There are'." },
                    { before: "How ", after: " you usually calm a nervous family member?", options: ["is", "have", "do", "are"], answer: "do", tip: "Para preguntar por un hábito con 'you' en presente simple usamos 'How do you...?'." },
                    { before: "What ", after: " you doing at the moment? The bell is ringing.", options: ["does", "do", "are", "has"], answer: "are", tip: "'What are you doing at the moment?' pregunta por una acción en este instante." },
                    { before: "Empathy is one of ", after: " values in person-centred care.", options: ["the most important", "more important", "most important", "importantest"], answer: "the most important", tip: "Superlativo de un adjetivo largo ('important'): 'the most + adjetivo'." },
                    { before: "They ", after: " ready for the morning shift.", options: ["is", "am", "are", "does"], answer: "are", tip: "Con plural ('they') en presente de 'to be' usamos 'are'." },
                    { before: "We ", after: " got enough time to explain everything calmly.", options: ["hasn't", "haven't", "aren't", "don't"], answer: "haven't", tip: "Con 'we' y 'got', la negativa es 'haven't got'." },
                    { before: "Look at ", after: " notes right here in my hand.", options: ["that", "those", "these", "this"], answer: "these", tip: "'These' es el plural de cercanía ('estos/estas')." },
                    { before: "Please pass me ", after: " water; the room is warm.", options: ["any", "some", "an", "many"], answer: "some", tip: "En peticiones o frases afirmativas con incontables ('water') usamos 'some'." },
                    { before: "How ", after: " you feel when a shift starts with tension?", options: ["are", "do", "has", "is"], answer: "do", tip: "Con 'feel' en presente simple y sujeto 'you', preguntamos 'How do you feel...?'." },
                    { before: "What ", after: " you doing with that wheelchair over there?", options: ["do", "are", "have", "does"], answer: "are", tip: "Con 'you' y acción en curso ('doing'), usamos 'What are you doing...?'." }
                ]
            },
            B: {
                label: "Modelo B — Simulacro 2",
                questions: [
                    { before: "Today's session is ", after: " than yesterday's workshop.", options: ["gooder", "best", "better", "more good"], answer: "better", tip: "'Good' es irregular: su forma comparativa es 'better' ('better than')." },
                    { before: "He ", after: " not tired today; he slept well.", options: ["are", "am", "is", "have"], answer: "is", tip: "Con 'he' y negación con 'not' usamos 'is not' ('He is not...')." },
                    { before: "He ", after: " got a fever today.", options: ["haven't", "aren't", "hasn't", "doesn't"], answer: "hasn't", tip: "Con 'he' y 'got', la negativa es 'hasn't got'." },
                    { before: "Who left ", after: " folders over there on the far table?", options: ["this", "these", "that", "those"], answer: "those", tip: "'Those' es el plural de lejanía ('esos/esas' o 'aquellos/aquellas')." },
                    { before: "There aren't ", after: " extra chairs in this room.", options: ["some", "a", "any", "much"], answer: "any", tip: "En oraciones negativas con plurales contables usamos 'any'." },
                    { before: "What ", after: " you usually write in the daily report?", options: ["are", "is", "do", "have"], answer: "do", tip: "Para rutinas en presente simple con 'you' usamos 'What do you usually...?'." },
                    { before: "Right now, the caregiver ", after: " explaining the steps slowly.", options: ["is", "has", "does", "do"], answer: "is", tip: "En presente continuo con 'the caregiver' (3.ª persona singular) usamos 'is + -ing'." },
                    { before: "Respect is ", after: " quality a caregiver can show.", options: ["the best", "better", "best", "good"], answer: "the best", tip: "'The best' es el superlativo irregular de 'good'." },
                    { before: "We ", after: " not late for the team meeting.", options: ["isn't", "aren't", "am not", "doesn't"], answer: "aren't", tip: "Con 'we' en negativa del verbo 'to be' usamos 'aren't'." },
                    { before: "", after: " you got a pen to write the reminder?", options: ["Has", "Are", "Do", "Have"], answer: "Have", tip: "Las preguntas con 'have got' y 'you' empiezan por 'Have you got...?'." },
                    { before: "", after: " glass of water is for the resident here.", options: ["These", "Those", "This", "There"], answer: "This", tip: "'This' acompaña a un singular ('glass') que está cerca." },
                    { before: "Are there ", after: " new messages for the afternoon shift?", options: ["some", "a", "any", "much"], answer: "any", tip: "En preguntas generales con plurales contables empleamos 'any'." },
                    { before: "She ", after: " carefully to the family's concerns.", options: ["listen", "listens", "listening", "are listen"], answer: "listens", tip: "En presente simple afirmativo con 'she', el verbo lleva '-s' ('listens')." },
                    { before: "She ", after: " sleeping at the moment; she is reading.", options: ["doesn't", "isn't", "haven't", "aren't"], answer: "isn't", tip: "La negativa en presente continuo con 'she' es 'isn't + verbo-ing'." },
                    { before: "This explanation is ", after: " than the first one.", options: ["short", "shorter", "the shortest", "more short"], answer: "shorter", tip: "Adjetivo corto ('short') en comparativo: 'shorter than'." },
                    { before: "I ", after: " not angry; I am just explaining the rule.", options: ["isn't", "aren't", "am not", "don't"], answer: "am not", tip: "La forma negativa con 'I' y 'to be' es 'am not' (no 'amn't')." },
                    { before: "", after: " she got a mobility aid in the room?", options: ["Have", "Does", "Has", "Is"], answer: "Has", tip: "Con 'she' y 'got', la pregunta empieza por 'Has she got...?'." },
                    { before: "Please close ", after: " window far away from the bed.", options: ["this", "these", "that", "those"], answer: "that", tip: "'That' se usa para un singular ('window') alejado." },
                    { before: "There are ", after: " leaflets on the reception desk.", options: ["any", "some", "an", "much"], answer: "some", tip: "En oraciones afirmativas con plurales contables ('leaflets') usamos 'some'." },
                    { before: "They ", after: " work on Sundays in the day centre.", options: ["doesn't", "aren't", "don't", "hasn't"], answer: "don't", tip: "Con 'they' y verbo de acción ('work'), la negativa es 'don't'." }
                ]
            },
            C: {
                label: "Modelo C — Simulacro 3",
                questions: [
                    { before: "We ", after: " using technical words right now.", options: ["don't", "hasn't", "aren't", "doesn't"], answer: "aren't", tip: "La negativa en presente continuo con 'we' es 'aren't + verbo-ing'." },
                    { before: "Monday is ", after: " day of the week in the centre.", options: ["busier", "the busiest", "most busy", "busyest"], answer: "the busiest", tip: "Adjetivo corto acabado en '-y' ('busy') en superlativo: 'the busiest'." },
                    { before: "", after: " you calm before starting the session?", options: ["Is", "Are", "Am", "Do"], answer: "Are", tip: "Las preguntas con 'to be' y sujeto 'you' empiezan por 'Are'." },
                    { before: "They ", after: " got two family visits this afternoon.", options: ["has", "is", "have", "does"], answer: "have", tip: "Con 'they' y 'got' usamos 'have got'." },
                    { before: "", after: " exercises are for today's morning session.", options: ["This", "That", "These", "There"], answer: "These", tip: "'These' acompaña a un plural ('exercises') cercano." },
                    { before: "I don't have ", after: " questions about the schedule today.", options: ["some", "a", "any", "one"], answer: "any", tip: "En frases negativas usamos 'any' ('don't have any')." },
                    { before: "He ", after: " rush when helping a resident get dressed.", options: ["don't", "doesn't", "isn't", "aren't"], answer: "doesn't", tip: "Con 'he' y verbo de acción ('rush'), la negativa es 'doesn't'." },
                    { before: "Are you ", after: " attention to the family's request right now?", options: ["pay", "pays", "paying", "paid"], answer: "paying", tip: "Tras 'Are you...' en presente continuo, el verbo principal lleva '-ing' ('paying')." },
                    { before: "This exercise is ", after: " than yesterday's exercise.", options: ["easy", "easiest", "easier", "more easy"], answer: "easier", tip: "'Easy' en comparativo cambia '-y' por '-ier': 'easier than'." },
                    { before: "", after: " the resident awake right now?", options: ["Are", "Am", "Is", "Does"], answer: "Is", tip: "Con sujeto singular ('the resident') y 'to be' preguntamos con 'Is'." },
                    { before: "The centre ", after: " got a quiet space for family talks.", options: ["have", "are", "has", "do"], answer: "has", tip: "Con sujeto singular ('The centre') y 'got' usamos 'has got'." },
                    { before: "Do you recognize ", after: " people standing at the far end of the hall?", options: ["this", "that", "these", "those"], answer: "those", tip: "'Those' se usa para personas plurales ('people') que están lejos." },
                    { before: "Would you like ", after: " tea before we begin?", options: ["any", "some", "a", "few"], answer: "some", tip: "En ofrecimientos educados usamos 'some' ('Would you like some...?')." },
                    { before: "", after: " she speak slowly when talking to older adults?", options: ["Do", "Is", "Does", "Have"], answer: "Does", tip: "Las preguntas en presente simple con 'she' y verbo de acción empiezan por 'Does'." },
                    { before: "I ", after: " preparing the materials for the group right now.", options: ["am", "is", "do", "have"], answer: "am", tip: "Con 'I' en presente continuo usamos 'am + verbo-ing' ('I am preparing')." },
                    { before: "That was ", after: " misunderstanding of the whole week.", options: ["worser", "worse", "the worst", "most bad"], answer: "the worst", tip: "'Bad' es irregular: su superlativo es 'the worst'." },
                    { before: "", after: " they new to the care home?", options: ["Is", "Am", "Does", "Are"], answer: "Are", tip: "Con sujeto plural ('they') y 'to be' preguntamos con 'Are'." },
                    { before: "You ", after: " got a great idea for the group activity.", options: ["has", "is", "have", "am"], answer: "have", tip: "Con 'you' y 'got' usamos 'have got'." },
                    { before: "", after: " booklet here explains the daily routine.", options: ["Those", "These", "This", "They"], answer: "This", tip: "'This' indica cercanía con un sustantivo singular ('booklet')." },
                    { before: "There ", after: " no noise in the room during the rest hour.", options: ["are", "is", "were", "have"], answer: "is", tip: "Con 'no noise' (incontable en singular) usamos 'There is'." }
                ]
            },
            D: {
                label: "Modelo D — Simulacro 4",
                questions: [
                    { before: "", after: " you practise active listening every day?", options: ["Does", "Are", "Do", "Is"], answer: "Do", tip: "Las preguntas en presente simple con 'you' y verbo de acción empiezan por 'Do'." },
                    { before: "", after: " he walking on his own right now?", options: ["Do", "Does", "Is", "Are"], answer: "Is", tip: "En presente continuo con 'he', la pregunta empieza por 'Is he + verbo-ing?'." },
                    { before: "The afternoon shift is ", after: " than the morning shift.", options: ["noisier", "noisiest", "more noisy", "noisy"], answer: "noisier", tip: "'Noisy' en comparativo cambia '-y' por '-ier': 'noisier than'." },
                    { before: "The room ", after: " quiet and bright this morning.", options: ["are", "am", "is", "have"], answer: "is", tip: "Con sustantivo singular ('The room') en presente de 'to be' se usa 'is'." },
                    { before: "She ", after: " got any questions about the care plan.", options: ["haven't", "hasn't", "isn't", "aren't"], answer: "hasn't", tip: "Con 'she' y 'got', la forma negativa es 'hasn't got'." },
                    { before: "Bring me ", after: " blankets on that distant shelf, please.", options: ["this", "these", "that", "those"], answer: "those", tip: "'Those' indica lejanía con un sustantivo plural ('blankets')." },
                    { before: "There ", after: " two steps before the entrance door.", options: ["is", "am", "are", "has"], answer: "are", tip: "Con 'two steps' (plural) usamos 'There are'." },
                    { before: "How ", after: " you adapt your voice for someone with hearing loss?", options: ["is", "does", "do", "are"], answer: "do", tip: "En presente simple con 'you' y verbo de acción ('adapt'), usamos 'How do you...?'." },
                    { before: "They ", after: " talking to the social worker at this moment.", options: ["is", "am", "are", "do"], answer: "are", tip: "Con 'they' en presente continuo usamos 'are + verbo-ing' ('They are talking')." },
                    { before: "Patience is ", after: " than rushing through tasks.", options: ["more helpful", "most helpful", "the most helpful", "helpfuler"], answer: "more helpful", tip: "'Helpful' es adjetivo largo: en comparativo usamos 'more helpful than'." },
                    { before: "My colleagues ", after: " very supportive during busy shifts.", options: ["is", "am", "are", "has"], answer: "are", tip: "Con plural ('My colleagues') en presente de 'to be' usamos 'are'." },
                    { before: "I ", after: " got a new schedule for this month.", options: ["has", "have", "am", "are"], answer: "have", tip: "Con 'I' y 'got' usamos 'have got'." },
                    { before: "", after: " chair right next to me is very comfortable.", options: ["These", "Those", "This", "That"], answer: "This", tip: "'This' se usa para un objeto singular ('chair') que está cerca." },
                    { before: "There ", after: " a glass of water on the table.", options: ["are", "is", "some", "any"], answer: "is", tip: "Con un sustantivo singular ('a glass of water') usamos 'There is'." },
                    { before: "He ", after: " his shift at three in the afternoon.", options: ["finish", "finishes", "finishing", "is finish"], answer: "finishes", tip: "Con 'he', los verbos acabados en '-sh' añaden '-es' ('finishes')." },
                    { before: "What ", after: " you doing right now in the activity room?", options: ["do", "have", "are", "is"], answer: "are", tip: "En presente continuo ('right now') con 'you', preguntamos 'What are you doing...?'." },
                    { before: "Active listening is ", after: " than just hearing words.", options: ["most important", "more important", "the most important", "importanter"], answer: "more important", tip: "Comparativo de un adjetivo largo ('important'): 'more + adjetivo + than'." },
                    { before: "", after: " I in the right room for the workshop?", options: ["Are", "Is", "Am", "Do"], answer: "Am", tip: "La pregunta con 'to be' y 'I' se forma con 'Am I...?'." },
                    { before: "She ", after: " got a very clear and calm voice.", options: ["have", "are", "has", "is"], answer: "has", tip: "Con 'she' y 'got' usamos 'has got'." },
                    { before: "Can you see ", after: " door at the end of the corridor?", options: ["this", "these", "that", "those"], answer: "that", tip: "'That' indica un elemento singular ('door') que está lejos." }
                ]
            },
            E: {
                label: "Modelo E — Simulacro 5",
                questions: [
                    { before: "We ", after: " the daily notes before leaving.", options: ["reviews", "review", "reviewing", "are review"], answer: "review", tip: "Con 'we' en presente simple afirmativo usamos el verbo en forma base ('review')." },
                    { before: "What ", after: " you doing at the moment? The bell is ringing.", options: ["does", "do", "are", "has"], answer: "are", tip: "'What are you doing at the moment?' pregunta por una acción en este instante." },
                    { before: "Empathy is one of ", after: " values in person-centred care.", options: ["the most important", "more important", "most important", "importantest"], answer: "the most important", tip: "Superlativo de un adjetivo largo ('important'): 'the most + adjetivo'." },
                    { before: "I ", after: " a care assistant in a day centre.", options: ["am", "is", "are", "have"], answer: "am", tip: "Con 'I' en presente simple del verbo 'to be' usamos 'am'." },
                    { before: "We ", after: " got enough time to explain everything calmly.", options: ["hasn't", "haven't", "aren't", "don't"], answer: "haven't", tip: "Con 'we' y 'got', la negativa es 'haven't got'." },
                    { before: "Look at ", after: " notes right here in my hand.", options: ["that", "those", "these", "this"], answer: "these", tip: "'These' es el plural de cercanía ('estos/estas')." },
                    { before: "There ", after: " three residents sitting in the courtyard.", options: ["is", "was", "are", "has"], answer: "are", tip: "Con un sustantivo plural ('three residents') usamos 'There are'." },
                    { before: "What ", after: " you do every morning before starting your shift?", options: ["are", "do", "does", "have"], answer: "do", tip: "En preguntas en presente simple con verbo de acción y 'you', usamos 'What do you...?'." },
                    { before: "What ", after: " you doing with that wheelchair over there?", options: ["do", "are", "have", "does"], answer: "are", tip: "Con 'you' y acción en curso ('doing'), usamos 'What are you doing...?'." },
                    { before: "Today's session is ", after: " than yesterday's workshop.", options: ["gooder", "best", "better", "more good"], answer: "better", tip: "'Good' es irregular: su forma comparativa es 'better' ('better than')." },
                    { before: "She ", after: " in the garden with the residents.", options: ["are", "is", "am", "do"], answer: "is", tip: "Con tercera persona singular ('she') en presente de 'to be' se usa 'is'." },
                    { before: "He ", after: " got a fever today.", options: ["haven't", "aren't", "hasn't", "doesn't"], answer: "hasn't", tip: "Con 'he' y 'got', la negativa es 'hasn't got'." },
                    { before: "Who left ", after: " folders over there on the far table?", options: ["this", "these", "that", "those"], answer: "those", tip: "'Those' es el plural de lejanía ('esos/esas' o 'aquellos/aquellas')." },
                    { before: "Please pass me ", after: " water; the room is warm.", options: ["any", "some", "an", "many"], answer: "some", tip: "En peticiones o frases afirmativas con incontables ('water') usamos 'some'." },
                    { before: "How ", after: " you usually calm a nervous family member?", options: ["is", "have", "do", "are"], answer: "do", tip: "Para preguntar por un hábito con 'you' en presente simple usamos 'How do you...?'." },
                    { before: "Right now, the caregiver ", after: " explaining the steps slowly.", options: ["is", "has", "does", "do"], answer: "is", tip: "En presente continuo con 'the caregiver' (3.ª persona singular) usamos 'is + -ing'." },
                    { before: "Respect is ", after: " quality a caregiver can show.", options: ["the best", "better", "best", "good"], answer: "the best", tip: "'The best' es el superlativo irregular de 'good'." },
                    { before: "They ", after: " ready for the morning shift.", options: ["is", "am", "are", "does"], answer: "are", tip: "Con plural ('they') en presente de 'to be' usamos 'are'." },
                    { before: "", after: " you got a pen to write the reminder?", options: ["Has", "Are", "Do", "Have"], answer: "Have", tip: "Las preguntas con 'have got' y 'you' empiezan por 'Have you got...?'." },
                    { before: "", after: " glass of water is for the resident here.", options: ["These", "Those", "This", "There"], answer: "This", tip: "'This' acompaña a un singular ('glass') que está cerca." }
                ]
            },
            F: {
                label: "Modelo F — Simulacro 6",
                questions: [
                    { before: "There aren't ", after: " extra chairs in this room.", options: ["some", "a", "any", "much"], answer: "any", tip: "En oraciones negativas con plurales contables usamos 'any'." },
                    { before: "How ", after: " you feel when a shift starts with tension?", options: ["are", "do", "has", "is"], answer: "do", tip: "Con 'feel' en presente simple y sujeto 'you', preguntamos 'How do you feel...?'." },
                    { before: "She ", after: " sleeping at the moment; she is reading.", options: ["doesn't", "isn't", "haven't", "aren't"], answer: "isn't", tip: "La negativa en presente continuo con 'she' es 'isn't + verbo-ing'." },
                    { before: "This explanation is ", after: " than the first one.", options: ["short", "shorter", "the shortest", "more short"], answer: "shorter", tip: "Adjetivo corto ('short') en comparativo: 'shorter than'." },
                    { before: "He ", after: " not tired today; he slept well.", options: ["are", "am", "is", "have"], answer: "is", tip: "Con 'he' y negación con 'not' usamos 'is not' ('He is not...')." },
                    { before: "", after: " she got a mobility aid in the room?", options: ["Have", "Does", "Has", "Is"], answer: "Has", tip: "Con 'she' y 'got', la pregunta empieza por 'Has she got...?'." },
                    { before: "Please close ", after: " window far away from the bed.", options: ["this", "these", "that", "those"], answer: "that", tip: "'That' se usa para un singular ('window') alejado." },
                    { before: "Are there ", after: " new messages for the afternoon shift?", options: ["some", "a", "any", "much"], answer: "any", tip: "En preguntas generales con plurales contables empleamos 'any'." },
                    { before: "What ", after: " you usually write in the daily report?", options: ["are", "is", "do", "have"], answer: "do", tip: "Para rutinas en presente simple con 'you' usamos 'What do you usually...?'." },
                    { before: "We ", after: " using technical words right now.", options: ["don't", "hasn't", "aren't", "doesn't"], answer: "aren't", tip: "La negativa en presente continuo con 'we' es 'aren't + verbo-ing'." },
                    { before: "Monday is ", after: " day of the week in the centre.", options: ["busier", "the busiest", "most busy", "busyest"], answer: "the busiest", tip: "Adjetivo corto acabado en '-y' ('busy') en superlativo: 'the busiest'." },
                    { before: "We ", after: " not late for the team meeting.", options: ["isn't", "aren't", "am not", "doesn't"], answer: "aren't", tip: "Con 'we' en negativa del verbo 'to be' usamos 'aren't'." },
                    { before: "They ", after: " got two family visits this afternoon.", options: ["has", "is", "have", "does"], answer: "have", tip: "Con 'they' y 'got' usamos 'have got'." },
                    { before: "", after: " exercises are for today's morning session.", options: ["This", "That", "These", "There"], answer: "These", tip: "'These' acompaña a un plural ('exercises') cercano." },
                    { before: "There are ", after: " leaflets on the reception desk.", options: ["any", "some", "an", "much"], answer: "some", tip: "En oraciones afirmativas con plurales contables ('leaflets') usamos 'some'." },
                    { before: "She ", after: " carefully to the family's concerns.", options: ["listen", "listens", "listening", "are listen"], answer: "listens", tip: "En presente simple afirmativo con 'she', el verbo lleva '-s' ('listens')." },
                    { before: "Are you ", after: " attention to the family's request right now?", options: ["pay", "pays", "paying", "paid"], answer: "paying", tip: "Tras 'Are you...' en presente continuo, el verbo principal lleva '-ing' ('paying')." },
                    { before: "This exercise is ", after: " than yesterday's exercise.", options: ["easy", "easiest", "easier", "more easy"], answer: "easier", tip: "'Easy' en comparativo cambia '-y' por '-ier': 'easier than'." },
                    { before: "I ", after: " not angry; I am just explaining the rule.", options: ["isn't", "aren't", "am not", "don't"], answer: "am not", tip: "La forma negativa con 'I' y 'to be' es 'am not' (no 'amn't')." },
                    { before: "The centre ", after: " got a quiet space for family talks.", options: ["have", "are", "has", "do"], answer: "has", tip: "Con sujeto singular ('The centre') y 'got' usamos 'has got'." }
                ]
            }
        };

        let currentModelKey = null;
        let userAnswers = {};

        function selectModel(modelKey) {
            currentModelKey = modelKey;
            userAnswers = {};

            document.querySelectorAll('.model-card').forEach(card => {
                card.classList.toggle('active-model', card.dataset.model === modelKey);
            });

            const modelData = EXAM_MODELS[modelKey];
            document.getElementById('exam-title').textContent = modelData.label;
            document.getElementById('validation-msg').textContent = "";
            document.getElementById('results-box').classList.remove('visible');
            document.getElementById('errors-container').innerHTML = "";

            renderQuestions(modelData.questions);
            updateProgress();

            const panel = document.getElementById('exam-panel');
            panel.classList.add('visible');
            panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function renderQuestions(questions) {
            const container = document.getElementById('questions-container');
            container.innerHTML = "";

            questions.forEach((q, qIdx) => {
                const qBox = document.createElement('div');
                qBox.className = "question-box";

                const prompt = document.createElement('p');
                prompt.className = "question-prompt";
                prompt.innerHTML = `<strong>${qIdx + 1}.</strong> ${q.before}<span id="blank-${qIdx}" class="blank-slot">_______</span>${q.after}`;
                qBox.appendChild(prompt);

                const optsGrid = document.createElement('div');
                optsGrid.className = "options-grid";

                q.options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.type = "button";
                    btn.className = "option-btn";
                    btn.textContent = opt;
                    btn.onclick = () => chooseOption(qIdx, opt, btn, optsGrid);
                    optsGrid.appendChild(btn);
                });

                qBox.appendChild(optsGrid);
                container.appendChild(qBox);
            });
        }

        function chooseOption(qIdx, chosenValue, clickedBtn, optsGrid) {
            userAnswers[qIdx] = chosenValue;
            document.getElementById('validation-msg').textContent = "";

            optsGrid.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
            clickedBtn.classList.add('selected');

            const blankEl = document.getElementById(`blank-${qIdx}`);
            if (blankEl) {
                blankEl.textContent = chosenValue;
            }

            updateProgress();
        }

        function updateProgress() {
            if (!currentModelKey) return;
            const total = EXAM_MODELS[currentModelKey].questions.length;
            const answered = Object.keys(userAnswers).length;
            document.getElementById('answered-counter').textContent = `Respondidas: ${answered} / ${total}`;
        }

        function resetCurrentModel() {
            if (!currentModelKey) return;
            selectModel(currentModelKey);
        }

        function gradeExam() {
            if (!currentModelKey) return;
            const questions = EXAM_MODELS[currentModelKey].questions;

            if (Object.keys(userAnswers).length < questions.length) {
                document.getElementById('validation-msg').textContent = `Completa las ${questions.length} frases antes de corregir el examen.`;
                return;
            }

            document.getElementById('validation-msg').textContent = "";

            let correctCount = 0;
            const errors = [];

            questions.forEach((q, idx) => {
                const given = userAnswers[idx];
                if (given === q.answer) {
                    correctCount++;
                } else {
                    errors.push({
                        number: idx + 1,
                        fullSentence: `${q.before}[${q.answer}]${q.after}`,
                        given,
                        answer: q.answer,
                        tip: q.tip
                    });
                }
            });

            const score = ((correctCount / questions.length) * 10).toFixed(2).replace(/\.00$/, '');
            const resultsBox = document.getElementById('results-box');
            const scoreBadge = document.getElementById('score-badge');
            const scoreDetail = document.getElementById('score-detail');
            const errorsContainer = document.getElementById('errors-container');

            scoreBadge.textContent = `Nota: ${score} / 10`;
            scoreDetail.textContent = `Aciertos: ${correctCount} de ${questions.length} · Fallos: ${errors.length}`;
            errorsContainer.innerHTML = "";

            if (errors.length === 0) {
                const perfect = document.createElement('div');
                perfect.className = "perfect-msg";
                perfect.textContent = "¡Excelente! No has cometido ningún error en este modelo.";
                errorsContainer.appendChild(perfect);
            } else {
                errors.forEach(err => {
                    const card = document.createElement('div');
                    card.className = "error-card";
                    card.innerHTML = `
                        <div class="err-q">Pregunta ${err.number}: ${err.fullSentence}</div>
                        <div class="err-wrong">Tu respuesta: ${err.given}</div>
                        <div class="err-right">Respuesta correcta: ${err.answer}</div>
                        <div class="err-note">${err.tip}</div>
                    `;
                    errorsContainer.appendChild(card);
                });
            }

            resultsBox.classList.add('visible');
            resultsBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
    </script>
