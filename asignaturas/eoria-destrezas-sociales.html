<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teoría - Destrezas sociales</title>
    <style>
        :root {
            --bg-board: #2b3a32;
            --board-frame: #4a3525;
            --text-chalk: #f4f4f0;
            --postit-yellow: #fff3a8;
            --text-dark: #2b2b2b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #1a2420;
            background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 0);
            background-size: 24px 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .board-container {
            width: 100%;
            max-width: 1100px;
            background-color: var(--bg-board);
            border: 14px solid var(--board-frame);
            border-radius: 18px;
            padding: 35px 30px;
            box-shadow: inset 0 0 60px rgba(0,0,0,0.6), 0 15px 35px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        header h1 {
            color: var(--text-chalk);
            font-size: 2.1em;
            border-bottom: 2px dashed rgba(255,255,255,0.25);
            padding-bottom: 15px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .docs-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 18px;
            padding: 5px 0;
        }

        .doc-item {
            background-color: var(--postit-yellow);
            padding: 22px 20px;
            border-radius: 6px 6px 6px 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: var(--text-dark);
            box-shadow: 4px 6px 15px rgba(0,0,0,0.35);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            gap: 18px;
        }

        .doc-item:hover {
            transform: translateY(-3px);
            box-shadow: 6px 9px 20px rgba(0,0,0,0.45);
        }

        .doc-info h3 {
            font-size: 1.18em;
            font-weight: 700;
            color: #222;
            line-height: 1.3;
        }

        .doc-info p {
            font-size: 0.88em;
            opacity: 0.85;
            margin-top: 8px;
            line-height: 1.4;
        }

        .download-btn {
            background-color: var(--board-frame);
            color: var(--text-chalk);
            padding: 9px 15px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.85em;
            text-align: center;
            align-self: flex-start;
            transition: opacity 0.2s, background-color 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .download-btn:hover {
            opacity: 0.92;
            background-color: #5c432f;
        }

        .back-nav {
            margin-top: 5px;
        }

        .back-btn {
            color: var(--text-chalk);
            text-decoration: none;
            font-size: 0.95em;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            opacity: 0.85;
            transition: opacity 0.2s;
        }

        .back-btn:hover {
            opacity: 1;
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .board-container {
                border-width: 8px;
                padding: 20px 15px;
            }
            header h1 {
                font-size: 1.6em;
            }
        }
    </style>
</head>
<body>

    <main class="board-container">
        <header>
            <h1>Teoría - Documentos y Temas Disponibles</h1>
        </header>

        <div class="docs-list">
            <div class="doc-item">
                <div class="doc-info">
                    <h3>Unidad 1: El arte de conectar</h3>
                    <p>Documento teórico de apuntes y contenidos fundamentales.</p>
                </div>
                <a href="unidad1-el-arte-de-conectar.pdf" class="download-btn" download>📥 Descargar PDF</a>
            </div>
        </div>

        <div class="back-nav">
            <a href="destrezas-sociales.html" class="back-btn">&larr; Volver a la asignatura</a>
        </div>
    </main>

</body>
</html>
