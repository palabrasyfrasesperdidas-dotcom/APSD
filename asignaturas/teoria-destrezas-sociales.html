<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teoría - Destrezas Sociales</title>
    <style>
        :root {
            --bg-board: #2b3a32;
            --board-frame: #4a3525;
            --text-chalk: #f4f4f0;
            --postit-yellow: #fff3a8;
            --text-dark: #2b2b2b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #1a2420;
            background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 0);
            background-size: 24px 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .board-container {
            width: 100%;
            max-width: 1100px;
            background-color: var(--bg-board);
            border: 14px solid var(--board-frame);
            border-radius: 18px;
            padding: 35px 30px;
            box-shadow: inset 0 0 60px rgba(0,0,0,0.6), 0 15px 35px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        header h1 {
            color: var(--text-chalk);
            font-size: 2.1em;
            border-bottom: 2px dashed rgba(255,255,255,0.25);
            padding-bottom: 15px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .topics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            padding: 5px 0;
        }

        .topic-card {
            background-color: var(--postit-yellow);
            color: var(--text-dark);
            border-radius: 6px 6px 6px 16px;
            padding: 24px 22px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 4px 6px 15px rgba(0,0,0,0.35);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            gap: 18px;
            min-height: 185px;
        }

        .topic-card:hover {
            transform: translateY(-3px);
            box-shadow: 6px 9px 20px rgba(0,0,0,0.45);
        }

        .topic-card h3 {
            font-size: 1.25em;
            font-weight: 700;
            color: #222;
            line-height: 1.3;
        }

        .topic-card p {
            font-size: 0.9em;
            opacity: 0.85;
            margin-top: 8px;
            line-height: 1.4;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background-color: var(--board-frame);
            color: var(--text-chalk);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.92em;
            padding: 10px 16px;
            border-radius: 8px;
            align-self: flex-start;
            transition: background-color 0.2s ease, transform 0.15s ease;
        }

        .download-btn:hover {
            background-color: #36261a;
            transform: scale(1.02);
        }

        .back-nav {
            margin-top: 5px;
        }

        .back-btn {
            color: var(--text-chalk);
            text-decoration: none;
            font-size: 0.95em;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            opacity: 0.85;
            transition: opacity 0.2s;
        }

        .back-btn:hover {
            opacity: 1;
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .board-container {
                border-width: 8px;
                padding: 20px 15px;
            }
            header h1 {
                font-size: 1.6em;
            }
        }
    </style>
</head>
<body>

    <main class="board-container">
        <header>
            <h1>Teoría - Documentos y Temas Disponibles</h1>
        </header>

        <div class="topics-grid">
            <!-- Unidad 1 -->
            <div class="topic-card">
                <div>
                    <h3>Unidad 1: Habilidades Sociales y Comunicación</h3>
                    <p>Documento teórico de apuntes y contenidos fundamentales de la unidad.</p>
                </div>
                <a href="destrezas-sociales-ud1.pdf" class="download-btn" download>
                    <span>📥</span> Descargar PDF
                </a>
            </div>
        </div>

        <div class="back-nav">
            <a href="destrezas-sociales.html" class="back-btn">&larr; Volver a la asignatura</a>
        </div>
    </main>

</body>
</html>
